<!doctype html><title>Hover wrapped</title>
<style>
  body { font: 14px sans-serif; margin: 0; }
  .dialog { position: fixed; left: 40px; top: 120px; opacity: 0; pointer-events: none; }
  .nav { position: absolute; left: 0; top: 0; width: 100vw; height: 50vh; opacity: 0; pointer-events: none; }
  article { min-height: 70vh; padding: 8px; border: 1px solid #ccc; }
  .tb { opacity: 0; }
  article:hover .tb { opacity: 1; }
</style>
<div id="app"><main>
  <div class="dialog" role="dialog"><button type="button" onclick="counts.dialogOk++">Dialog OK</button></div>
  <nav class="nav"><button type="button" onclick="counts.nav++">Menu item</button></nav>
  <article>A long message that is taller than half the viewport.
    <div class="tb"><button type="button" onclick="counts.copy++">Copy message</button></div></article>
</main></div>
<script>window.counts = {dialogOk: 0, nav: 0, copy: 0};</script>
