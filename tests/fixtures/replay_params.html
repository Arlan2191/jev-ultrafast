<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Orders</title></head>
<body>
<!-- The row titles differ on every load: ?name=<text> names the target order, a random suffix when it is absent. The
     target's Open button carries a test id; the decoy row beside it has none. The rows are plain divs, not list items:
     a row is a locator scope named by its first text, so a varying title would make the recorded scope unfindable.
     window.__clicked lists opened rows. -->
<main>
  <h1>Orders</h1>
  <div id="orders">
    <div data-row="decoy"><span id="decoy-title"></span> <button type="button" onclick="openRow('decoy')">Open</button></div>
    <div data-row="target"><span id="target-title"></span> <button type="button" data-testid="open-target" onclick="openRow('target')">Open</button></div>
  </div>
  <p id="opened"></p>
</main>
<script>
  const name = new URLSearchParams(location.search).get("name") || "Order " + Math.random().toString(36).slice(2, 8);
  document.getElementById("target-title").textContent = name;
  document.getElementById("decoy-title").textContent = "Other " + Math.random().toString(36).slice(2, 8);
  window.__clicked = [];
  function openRow(id) {
    window.__clicked.push(id);
    document.getElementById("opened").textContent = "Opened row " + id;
  }
</script>
</body>
</html>
